apiVersion: apps/v1
kind: Deployment
metadata:
  name: qa-support-web-pod
  namespace: pre-new-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qa-support-web-pod
  template:
    metadata:
      labels:
        app: qa-support-web-pod
    spec:
      serviceAccountName: qa-support-sa
      imagePullSecrets:
        - name: registry2
      containers:
        - name: qa-support-web-pod
          # image: securereg2.m-bank.mn:5000/qa-support-web-pod:1.1.6
          image: securereg2.m-bank.mn:5000/qa-support-web-pod:1.2.2
          imagePullPolicy: Always
          env:
            - name: QA_SWAGGER_KUBECONFIG
              value: /etc/qa-swagger/kubeconfig
          volumeMounts:
            - name: swagger-kubeconfig
              mountPath: /etc/qa-swagger
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 20
          ports:
            - containerPort: 5000
          resources:
            limits:
              cpu: "6"
              memory: "8Gi"
            requests:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: swagger-kubeconfig
          secret:
            secretName: qa-swagger-kubeconfig
